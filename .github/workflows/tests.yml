name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Run tests (Abaqus-dependent tests are excluded)
        run: pytest -q
      - name: Smoke-test the CLI
        run: |
          python -m tool_wear_demo.cli validate
          python -m tool_wear_demo.cli run --config config/demo_fast.yaml --no-png
